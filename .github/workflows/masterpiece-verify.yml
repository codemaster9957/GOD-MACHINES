name: Masterpiece Verification

on:
  push:
    branches:
      - feat/masterpiece-builder-v2
      - feat/vehicle-quick-swap
      - feat/god-machines-finish-pass
      - feature/100-improvements
      - fix/builder-integrity-pass
      - port/gundam-weapon-system-main
  pull_request:
    branches:
      - main
      - feat/masterpiece-builder-v2

permissions:
  contents: read

jobs:
  repository-invariants:
    name: Repository invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify GOD MACHINES architecture
        run: python scripts/verify_masterpiece.py

      - name: Run Structural category regression spec
        run: python tests/structural_category_source_spec.py

      - name: Run builder snap regression spec
        run: python tests/builder_snap_source_spec.py

      - name: Run builder integrity regression spec
        run: python tests/builder_integrity_source_spec.py

      - name: Run Gundam weapon integration regression spec
        run: python tests/gundam_weapon_source_spec.py

      - name: Verify 100-improvement polish contract
        run: python scripts/test_100_improvements_contract.py

      - name: Verify Workshop camera integration
        run: python scripts/verify_workshop_camera_port.py

  luau-syntax:
    name: Compile and test Luau
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build official Luau tools
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/luau-lang/luau.git /tmp/luau
          cmake -S /tmp/luau -B /tmp/luau-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLUAU_BUILD_CLI=ON \
            -DLUAU_BUILD_TESTS=OFF \
            -DLUAU_BUILD_WEB=OFF
          cmake --build /tmp/luau-build --target Luau.Compile.CLI Luau.Repl.CLI -j 2
          test -x /tmp/luau-build/luau-compile
          test -x /tmp/luau-build/luau

      - name: Syntax-check repository Luau
        shell: bash
        run: |
          set -euo pipefail
          compiler=/tmp/luau-build/luau-compile
          checked=0
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            "$compiler" "$file" >/dev/null
            checked=$((checked + 1))
          done < <(find src tests -type f -name '*.luau' -print0 | sort -z)
          echo "Luau syntax passed for $checked files"
          test "$checked" -gt 0

      - name: Run quick-swap behavior spec
        shell: bash
        run: /tmp/luau-build/luau tests/quick_swap_spec.luau

      - name: Run vehicle-trade behavior spec
        shell: bash
        run: /tmp/luau-build/luau tests/vehicle_trade_spec.luau

      - name: Run combat-polish contract
        shell: bash
        run: python scripts/test_combat_polish_contract.py
